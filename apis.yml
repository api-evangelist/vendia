apis:
- name: Vendia Share GraphQL API
  description: 'Every Vendia project (Uni) is provisioned with an auto-generated GraphQL
    API derived from its JSON Schema data model — get_X / list_XItems / list_XVersions
    queries and add_X / create_X / put_X / update_X / remove_X mutations, plus the
    Vendia File and Folder APIs (addVendia_File, listVendia_FileItems, getVendia_FileTask).
    Reads carry a readMode (CACHED, NODE_COMMITTED, NODE_LEDGERED, UNI_LEDGERED) and
    writes carry a syncMode; the @vendia_transaction directive makes multi-operation
    mutations atomic. The endpoint is provisioned per project and requires an OAuth
    bearer token or node API key, so the schema is not anonymously introspectable.'
  humanURL: https://docs.vendia.com/platform/operational/scalar-data/graphql/
  baseURL: https://api.share.vendia.com
