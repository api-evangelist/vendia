aid: vendia
name: Vendia
description: 'Vendia is an enterprise data platform company founded by Tim Wagner (creator
  of AWS Lambda) and Shruthi Rao (founder of the AWS blockchain practice). Its flagship
  product is the Vendia MCP Gateway — a managed, multi-tenant Model Context Protocol
  server that gives AI agents governed, audited access to Amazon S3 buckets, third-party
  REST APIs described by OpenAPI/Swagger ("API Catalogs"), and remote MCP servers behind
  a single OAuth-protected endpoint. Underneath sits Vendia Share, a real-time distributed
  data platform that exposes each project as an auto-generated GraphQL API over a
  consensus-backed ledger, with fine-grained permissions, RBAC, schema evolution, file
  and folder APIs, block/dead-letter notifications, and analytical data products
  ingested from S3, Snowflake, Databricks, BigQuery, Cloudera, MySQL and PostgreSQL.'
