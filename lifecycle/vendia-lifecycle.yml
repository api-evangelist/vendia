versioning:
  scheme: additive-schema-evolution
  docs: https://docs.vendia.com/platform/operational/modeling/schema-evolution/
  description: >-
    Vendia does not version its GraphQL API by URI path, header or date. The API is
    generated from each project's JSON Schema data model, so evolution happens at the
    schema level and is constrained to additive/non-breaking change: new types, new
    properties on existing types, and new enum values are allowed; removing types or
    properties, changing a property type, and changing the required flag are not.
    Vendia states "any changes introduced via schema evolution will never break
    existing applications in production."
  api_connection_versioning:
    description: >-
      API Catalog entries carry an optional version override in numeric semantic
      versioning form (for example 1.0.0, 2.1.3, 3.0.0).
    source: https://docs.vendia.com/platform/vendia-mcp-server/api-connections/
breaking_changes:
  policy: opt-in-only
  documented_exception:
    change: INDEX_REMOVED
    description: >-
      Removing an index is the one change Vendia classifies as potentially breaking.
      It requires explicit confirmation in the UI or the CLI flag
      --allowed-breaking-change=INDEX_REMOVED, and can break list queries using the
      order argument.
    source: https://docs.vendia.com/platform/operational/modeling/schema-evolution/
