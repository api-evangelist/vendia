findings:
- id: mcp-sandbox-host-broken
  severity: notable
  description: >-
    The banner on www.vendia.com links a "MCP Sandbox" at https://mcp-sandbox.vendia.com/,
    but that host presents a TLS certificate for *.netlify.app — the hostname does not
    match, so every standards-compliant client (curl, browsers) refuses the connection.
    Fetched with verification disabled it returns HTTP 404 with a 50-byte text/plain
    body. The advertised sandbox is unreachable as published.
  evidence:
  - url: https://mcp-sandbox.vendia.com/
    status: 0
    error: 'SSL: no alternative certificate subject name matches target host name'
    cert_subject: 'C=US, ST=California, L=San Francisco, O=Netlify, Inc, CN=*.netlify.app'
  - url: https://mcp-sandbox.vendia.com/
    status: 404
    note: fetched with TLS verification disabled
  checked: '2026-08-05'
